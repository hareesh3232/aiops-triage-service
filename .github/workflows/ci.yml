name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aiops-triage:ci .
      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8000:8000 aiops-triage:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1
